<circle cx="86"  cy="68" r="2"   fill="#4466dd"/>
<circle cx="210" cy="68" r="4"   fill="#0a0d24" stroke="#4466dd" stroke-width="1.5"/>
<circle cx="210" cy="68" r="2"   fill="#4466dd"/>

<text x="112" y="107" class="nc-n">N</text>
<text x="152" y="107" class="nc-c">c</text>

<line x1="90"  y1="128" x2="104" y2="128" stroke="#5577ee" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
<polyline points="104,128 111,128 118,114 126,142 132,122 138,122 144,128 166,128"
