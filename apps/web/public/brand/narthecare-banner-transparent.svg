<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="shieldGlow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#1e2a6e" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#0a0d24" stop-opacity="0.75"/>
  </radialGradient>
</defs>
<style>
  .nc-n  { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-style: italic; font-size: 52px; fill: #dde4ff; }
  .nc-c  { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-style: italic; font-size: 44px; fill: #7b96e8; }
  .name  { font-family: system-ui, sans-serif; font-weight: 700; fill: #EEF0FF; letter-spacing: 5px; font-size: 26px; }
  .sub   { font-family: system-ui, sans-serif; font-weight: 600; fill: #91A7FF; letter-spacing: 2.5px; font-size: 10px; }
  .tm    { font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #91A7FF; opacity: 0.85; }
  .sl    { font-family: system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; }
</style>

<!-- No background rect — transparent -->

<!-- Left / right accent bars -->
<rect x="0"    y="0" width="5" height="180" fill="#3B5BDB"/>
<rect x="1195" y="0" width="5" height="180" fill="#5577ee"/>

